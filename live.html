<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rural Lite TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
    margin:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:sans-serif;
}

.player{
    width:100%;
    max-width:700px;
}

video{
    width:100%;
    height:auto;
    background:black;
}
</style>
</head>

<body>

<div class="player">
    <video id="video"
           controls
           autoplay
           playsinline
           preload="none"
           poster="">
    </video>
</div>

<script>
const video = document.getElementById('video');
const stream = 'https://lbgo.bozztv.com/ssh101/ssh101/kyogatv2006/playlist.m3u8';

if (Hls.isSupported()) {

    const hls = new Hls({

        // ===== RURAL / LOW DATA SETTINGS =====
        enableWorker: true,

        // Start instantly with lowest quality
        startLevel: 0,
        autoStartLoad: true,

        // LOCK BANDWIDTH (IMPORTANT for weak networks)
        capLevelToPlayerSize: true,
        maxLoadingDelay: 4,
        maxBufferLength: 6,        // very small buffer
        backBufferLength: 2,

        // NETWORK FRIENDLY RETRIES
        fragLoadingRetryDelay: 2000,
        manifestLoadingRetryDelay: 3000,
        fragLoadingMaxRetry: 10,
        manifestLoadingMaxRetry: 6,

        // REDUCE STALLING ON SLOW NETWORKS
        nudgeOffset: 0.2,
        nudgeMaxRetry: 5
    });

    hls.loadSource(stream);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
        // FORCE LOWEST QUALITY ALWAYS
        hls.currentLevel = 0;
        video.play().catch(()=>{});
    });

    // If network is bad → keep forcing lowest level
    hls.on(Hls.Events.LEVEL_SWITCHED, () => {
        if (hls.currentLevel !== 0) {
            hls.currentLevel = 0;
        }
    });

} else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = stream;
    video.play().catch(()=>{});
}
</script>

</body>
</html>
