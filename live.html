<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lite Live TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:95%;
    max-width:900px;
}

.player{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:10px;
    overflow:hidden;
}

video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}
</style>
</head>

<body>

<div class="container">
    <div class="player">
        <video id="video"
               controls
               autoplay
               playsinline
               preload="metadata"></video>
    </div>
</div>

<script>
const video = document.getElementById('video');
const videoSrc = 'https://lbgo.bozztv.com/ssh101/ssh101/kyogatv2006/playlist.m3u8';

if (Hls.isSupported()) {

    const hls = new Hls({
        // 🔥 LITE MODE SETTINGS
        enableWorker: true,
        lowLatencyMode: true,

        // start with lowest quality possible
        startLevel: 0,

        // avoid switching too aggressively on weak networks
        capLevelToPlayerSize: true,

        // BUFFER OPTIMIZATION (key for weak devices)
        maxBufferLength: 10,        // seconds
        maxMaxBufferLength: 20,
        backBufferLength: 5,

        // reduce network stress
        manifestLoadingTimeOut: 10000,
        fragLoadingTimeOut: 20000,

        // smoother on unstable networks
        fragLoadingMaxRetry: 6,
        manifestLoadingMaxRetry: 4
    });

    hls.loadSource(videoSrc);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(() => {});
    });

    // FORCE LOWEST QUALITY FIRST
    hls.on(Hls.Events.LEVEL_SWITCHED, (_, data) => {
        console.log("Current quality level:", data.level);
    });

} else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari fallback (already adaptive but no control)
    video.src = videoSrc;
    video.addEventListener('loadedmetadata', () => {
        video.play().catch(() => {});
    });
}
</script>

</body>
</html>
