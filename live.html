<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live TV</title>

<style>
body{
    margin:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

#video{
    width:100%;
    max-width:1280px;
    height:auto;
    background:#000;
}

#message{
    position:absolute;
    top:20px;
    left:20px;
    color:#fff;
    background:rgba(0,0,0,.6);
    padding:10px 15px;
    border-radius:8px;
    font-family:Arial,sans-serif;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

</head>
<body>

<div id="message">Loading stream...</div>

<video
    id="video"
    controls
    autoplay
    muted
    playsinline
></video>

<script>

const STREAM_URL =
"https://live21.bozztv.com/akamaissh101/ssh101/livetv1995/playlist.m3u8";

const video = document.getElementById("video");
const msg = document.getElementById("message");

if (Hls.isSupported()) {

    const hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        backBufferLength: 90
    });

    hls.loadSource(STREAM_URL);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
        msg.innerHTML = "🟢 LIVE";
        video.play().catch(() => {
            msg.innerHTML = "Click Play to start the stream.";
        });
    });

    hls.on(Hls.Events.ERROR, (event, data) => {
        console.error(data);

        if (data.fatal) {
            msg.innerHTML = "❌ Unable to play the stream.";
        }
    });

} else if (video.canPlayType('application/vnd.apple.mpegurl')) {

    video.src = STREAM_URL;

    video.addEventListener('loadedmetadata', () => {
        video.play();
        msg.innerHTML = "🟢 LIVE";
    });

} else {

    msg.innerHTML = "Your browser does not support HLS.";

}

</script>

</body>
</html>
