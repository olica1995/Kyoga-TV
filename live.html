<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kyoga TV - Online</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      margin: 10px 0 10px;
      font-size: 2em;
      color: #00ffe1;
    }

    video {
      width: 95%;
      max-width: 900px;
      max-height: 80vh;
      border: 4px solid #00ffe1;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 255, 225, 0.4);
      background: #000;
      transition: opacity 0.5s ease;
    }

    button, .volume-slider {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #00ffe1;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      color: #000;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    button:hover, .volume-slider:hover {
      background-color: #00cbb6;
    }

    .loader {
      margin-top: 10px;
      font-size: 0.9em;
      color: #aaa;
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }

    input[type="range"] {
      width: 150px;
      accent-color: #00ffe1;
    }

    label {
      font-size: 1rem;
      color: #00ffe1;
    }

    #liveIndicator {
      margin-top: 10px;
      font-weight: bold;
      color: red;
      display: none;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <h1>Kyoga TV - Online</h1>

  <video id="video" controls autoplay playsinline muted></video>
  <div class="loader" id="loader">Loading videos...</div>
  <div id="liveIndicator">● LIVE</div>

  <div class="volume-container">
    <label for="volumeSlider">Volume</label>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" aria-label="Video volume control">
  </div>

  <button id="backBtn" aria-label="Go back to home page">Back to Home Page</button>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0"></script>
  <script>
    const video = document.getElementById('video');
    const loader = document.getElementById('loader');
    const volumeSlider = document.getElementById('volumeSlider');
    const backBtn = document.getElementById('backBtn');
    const liveIndicator = document.getElementById('liveIndicator');

    const streamUrl = 'https://guyana-cheats-dvds-total.trycloudflare.com/hls/stream.m3u8';
    let hls = null;
    let hlsLiveOnline = false;
    let fallbackTimeout = null;

    // Pre-recorded videos
    const videoTray = ['shores (1).mp4', 'olix.mp4', 'voice.mp4'];
    let currentTrayIndex = 0;

    // Enable volume
    function enableVolume() {
      video.muted = false;
      video.volume = volumeSlider.value;
    }

    // Volume control
    volumeSlider.addEventListener('input', () => {
      video.volume = volumeSlider.value;
    });

    // Back button
    backBtn.addEventListener('click', () => {
      window.location.href = 'home.html';
    });

    // Play pre-recorded videos in a loop
    function playTrayVideo() {
      if (videoTray.length === 0) return;

      const src = videoTray[currentTrayIndex];
      video.style.opacity = 0;
      video.src = src;

      // Check if the video can play
      video.load();
      video.oncanplay = () => {
        video.play().then(() => {
          enableVolume();
          video.style.opacity = 1;
          loader.style.display = 'none';
          liveIndicator.style.display = 'none';
        }).catch(() => loader.innerText = 'Click to play video');
      };

      // If video fails, skip to the next one
      video.onerror = () => {
        console.warn(`Failed to load video: ${src}. Skipping to next.`);
        currentTrayIndex = (currentTrayIndex + 1) % videoTray.length;
        playTrayVideo();
      };

      video.onended = () => {
        currentTrayIndex = (currentTrayIndex + 1) % videoTray.length;
        playTrayVideo();
      };
    }

    // Stop HLS
    function stopHLS() {
      if (hls) {
        hls.destroy();
        hls = null;
      }
      hlsLiveOnline = false;
      liveIndicator.style.display = 'none';
    }

    // Start HLS
    function startHLS() {
      if (hlsLiveOnline) return;

      loader.innerText = 'Checking live stream...';

      if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          hlsLiveOnline = true;
          liveIndicator.style.display = 'block';
          video.pause();
          video.play().then(enableVolume).catch(() => loader.innerText = 'Click to play live stream');
          loader.style.display = 'none';
          if (fallbackTimeout) clearTimeout(fallbackTimeout);
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            stopHLS();
            fallbackTimeout = setTimeout(() => {
              if (!hlsLiveOnline) playTrayVideo();
              loader.innerText = 'Live stream offline. Playing pre-recorded videos.';
            }, 3000);
          }
        });

      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.addEventListener('loadedmetadata', () => {
          hlsLiveOnline = true;
          liveIndicator.style.display = 'block';
          video.pause();
          video.play().then(enableVolume).catch(() => loader.innerText = 'Click to play live stream');
        });
      } else {
        loader.innerText = 'Your browser does not support HLS playback.';
      }
    }

    // Periodically check for live stream
    setInterval(() => {
      if (!hlsLiveOnline) startHLS();
    }, 10000);

    // Initialize: play pre-recorded videos first
    playTrayVideo();

    // Attempt live stream on start
    startHLS();
  </script>
</body>
</html>
