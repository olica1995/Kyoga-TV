<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kyoga TV - Live</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      margin: 10px 0;
      font-size: 2em;
      color: #00ffe1;
    }

    video {
      width: 95%;
      max-width: 900px;
      max-height: 80vh;
      border: 4px solid #00ffe1;
      border-radius: 12px;
      background: #000;
      box-shadow: 0 0 20px rgba(0, 255, 225, 0.4);
    }

    .status {
      margin-top: 10px;
      font-size: 0.95rem;
      color: #aaa;
    }

    #liveIndicator {
      margin-top: 8px;
      font-weight: bold;
      color: red;
      display: none;
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }

    input[type="range"] {
      width: 150px;
      accent-color: #00ffe1;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #00ffe1;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      color: #000;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #00cbb6;
    }
  </style>
</head>

<body>

  <h1>Kyoga TV - Live</h1>

  <video
    id="video"
    controls
    autoplay
    muted
    playsinline
  ></video>

  <div id="liveIndicator">● LIVE</div>
  <div class="status" id="statusText">Connecting to live stream...</div>

  <div class="volume-container">
    <label for="volumeSlider">Volume</label>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
  </div>

  <button onclick="window.location.href='home.html'">Back to Home</button>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0"></script>
  <script>
    const video = document.getElementById('video');
    const statusText = document.getElementById('statusText');
    const liveIndicator = document.getElementById('liveIndicator');
    const volumeSlider = document.getElementById('volumeSlider');

    const streamUrl = 'https://live21.bozztv.com/akamaissh101/ssh101/livetv1995/playlist.m3u8';
    let hls;

    // Volume control
    volumeSlider.addEventListener('input', () => {
      video.volume = volumeSlider.value;
      if (video.muted && video.volume > 0) video.muted = false;
    });

    // User interaction unmutes (mobile safe)
    video.addEventListener('click', () => {
      video.muted = false;
      video.volume = volumeSlider.value;
    }, { once: true });

    function startLiveStream() {
      statusText.innerText = 'Buffering live stream...';

      if (Hls.isSupported()) {
        hls = new Hls({
          liveSyncDurationCount: 3,       // Keep low latency
          maxLiveSyncPlaybackRate: 1.5,   // Smooth playback speed
          lowLatencyMode: true,           // Reduce delay
          backBufferLength: 90            // Keep buffer to prevent stutter
        });

        hls.loadSource(streamUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
          liveIndicator.style.display = 'block';
          statusText.innerText = 'Live stream connected';
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                statusText.innerText = 'Network error, retrying...';
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                statusText.innerText = 'Media error, recovering...';
                hls.recoverMediaError();
                break;
              default:
                statusText.innerText = 'Streaming error, buffering...';
                break;
            }
          }
        });

      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.play().catch(() => {});
        liveIndicator.style.display = 'block';
        statusText.innerText = 'Live stream connected';
      } else {
        statusText.innerText = 'Your browser does not support live streaming.';
      }
    }

    startLiveStream();

    // Optional: reconnect periodically if video is stalled
    setInterval(() => {
      if (video.readyState === 0 && hls) {
        statusText.innerText = 'Stream stalled, reconnecting...';
        hls.startLoad();
      }
    }, 10000);
  </script>

</body>
  </html>
