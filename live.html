<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kyoga TV Live</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
    margin: 0;
    background: #000;
}

.video-container {
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: black;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
}
</style>

</head>

<body>

<div class="video-container">

<video 
id="player"
controls
autoplay
playsinline>
</video>

</div>


<script>

const video = document.getElementById("player");

const streamURL =
"https://lbgo.bozztv.com/ssh101/ssh101/kyogatv2026/playlist.m3u8";


if (Hls.isSupported()) {

    const hls = new Hls({

        enableWorker: true,

        autoStartLoad: true,

        startLevel: -1,

        capLevelToPlayerSize: true,

        maxBufferLength: 30,

        maxMaxBufferLength: 60

    });


    hls.loadSource(streamURL);

    hls.attachMedia(video);


    hls.on(Hls.Events.MANIFEST_PARSED, function(){

        video.volume = 1.0;

        video.play().catch(function(){

            console.log("Press play to start audio");

        });

    });


    hls.on(Hls.Events.ERROR, function(event,data){

        if(data.fatal){

            hls.destroy();

            setTimeout(()=>{

                location.reload();

            },3000);

        }

    });


}

else if(video.canPlayType("application/vnd.apple.mpegurl")){


    video.src = streamURL;

    video.volume = 1.0;

}


</script>


</body>
</html>
