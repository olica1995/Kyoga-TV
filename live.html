<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:1000px;
}

.player{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:12px;
    overflow:hidden;
}

video{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    background:#000;
}
</style>
</head>
<body>

<div class="container">
    <div class="player">
        <video id="video" controls autoplay></video>
    </div>
</div>

<script>
const video = document.getElementById('video');
const videoSrc = 'https://lbgo.bozztv.com/ssh101/ssh101/kyogatv2006/playlist.m3u8';

if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(videoSrc);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, function () {
        video.play().catch(() => {});
    });
} else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = videoSrc;
    video.addEventListener('loadedmetadata', function () {
        video.play().catch(() => {});
    });
}
</script>

</body>
</html>
