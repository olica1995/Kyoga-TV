<!DOCTYPE html>
<html>
<head>
<title>Kyoga TV Admin</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

<style>
body { font-family:Arial; padding:20px; max-width:500px; margin:auto; }
input, textarea, button { width:100%; margin:10px 0; padding:10px; }

h1 {
  text-align:center;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { color:#1d1147; }
  to { color:#f0ac45; }
}
</style>
</head>

<body>

<h1>Kyoga TV Admin</h1>

<!-- LOGIN -->
<div id="loginDiv">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="adminDiv" style="display:none;">

<h3>Post News</h3>

<input id="title" placeholder="Title">
<input id="author" placeholder="Author">
<input id="location" placeholder="Location">
<input id="category" placeholder="Category">

<input type="file" id="imageFile">

<textarea id="description" placeholder="Description"></textarea>

<button onclick="postNews()">Publish News</button>
<button onclick="logout()">Logout</button>

</div>

<script>
// 🔥 YOUR CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyBGgDRu812I2saYcq3W0LuLyH8WpxDyHv8",
  authDomain: "kyogatvnews.firebaseapp.com",
  projectId: "kyogatvnews",
  storageBucket: "kyogatvnews.firebasestorage.app",
  messagingSenderId: "721054655198",
  appId: "1:721054655198:web:abf9aebc667366aefe184f"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();
const storage = firebase.storage();

// 🔐 LOGIN
function login(){
  auth.signInWithEmailAndPassword(email.value, password.value)
  .catch(err=>alert(err.message));
}

// 🔓 LOGOUT
function logout(){
  auth.signOut();
}

// 🔄 AUTH STATE
auth.onAuthStateChanged(user=>{
  if(user){
    loginDiv.style.display="none";
    adminDiv.style.display="block";
  } else {
    loginDiv.style.display="block";
    adminDiv.style.display="none";
  }
});

// 📰 POST NEWS WITH IMAGE UPLOAD
async function postNews(){
  const file = document.getElementById("imageFile").files[0];

  if(!file) return alert("Select image");

  const storageRef = storage.ref("newsImages/" + file.name);
  await storageRef.put(file);

  const imageURL = await storageRef.getDownloadURL();

  await db.collection("news").add({
    title: title.value,
    author: author.value,
    location: location.value,
    category: category.value,
    description: description.value,
    image: imageURL,
    date: new Date(),
    views: 0
  });

  alert("✅ News Published!");
}
</script>

</body>
</html>
