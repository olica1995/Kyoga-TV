<!DOCTYPE html>
<html>
<head>
<title>Kyoga TV Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<style>
body { 
  font-family: Arial; 
  max-width:600px; 
  margin:auto; 
  padding:20px; 
  background:#f2f2f2; 
}

input, textarea, button { 
  width:100%; 
  padding:10px; 
  margin:8px 0; 
}

button { 
  background:#1d1147; 
  color:#fff; 
  border:none; 
  cursor:pointer;
}

button:hover {
  opacity:0.9;
}

#adminDiv { display:none; }

.card {
  background:#fff;
  padding:15px;
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
  margin-bottom:15px;
}

img.preview {
  width:100%;
  max-height:200px;
  object-fit:contain;
  background:#eee;
  border-radius:6px;
}
</style>
</head>

<body>

<h2>Admin Panel</h2>

<div id="loginDiv" class="card">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="loginBtn">Login</button>
</div>

<div id="adminDiv">

  <div class="card">
    <input id="title" placeholder="Title">
    <input id="author" placeholder="Author">
    <input id="location" placeholder="Location">
    <input id="category" placeholder="Category">

    <!-- Image URL -->
    <input id="imageURL" placeholder="Image URL (https://...)">

    <!-- IMAGE PREVIEW -->
    <img id="imagePreview" class="preview" style="display:none;">

    <textarea id="description" placeholder="Description"></textarea>

    <button id="publishBtn">Publish</button>
    <button id="logoutBtn">Logout</button>
  </div>

  <hr>

  <h3>Existing Articles</h3>
  <div id="articlesList"></div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBGgDRu812I2saYcq3W0LuLyH8WpxDyHv8",
  authDomain: "kyogatvnews.firebaseapp.com",
  projectId: "kyogatvnews"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let editingId = null;

// IMAGE PREVIEW
document.getElementById("imageURL").addEventListener("input", () => {
  const url = document.getElementById("imageURL").value;
  const preview = document.getElementById("imagePreview");

  if(url){
    preview.src = url;
    preview.style.display = "block";
  } else {
    preview.style.display = "none";
  }
});

// AUTH STATE
auth.onAuthStateChanged(user => {
  if (user) {
    loginDiv.style.display = "none";
    adminDiv.style.display = "block";
    loadArticles();
  } else {
    loginDiv.style.display = "block";
    adminDiv.style.display = "none";
  }
});

// LOGIN
loginBtn.onclick = async () => {
  try {
    await auth.signInWithEmailAndPassword(email.value, password.value);
    alert("✅ Logged in");
  } catch (err) {
    alert(err.message);
  }
};

// LOGOUT
logoutBtn.onclick = () => {
  auth.signOut();
};

// CLEAR FORM
function clearForm() {
  title.value = "";
  author.value = "";
  location.value = "";
  category.value = "";
  description.value = "";
  imageURL.value = "";
  imagePreview.style.display = "none";
}

// PUBLISH / UPDATE
publishBtn.onclick = async () => {
  try {
    const user = auth.currentUser;

    if (!user) {
      alert("❌ Not logged in");
      return;
    }

    if (!title.value || !description.value) {
      alert("❌ Title and description required");
      return;
    }

    if (!imageURL.value) {
      alert("❌ Please provide an image URL");
      return;
    }

    const data = {
      title: title.value,
      author: author.value,
      location: location.value,
      category: category.value,
      description: description.value,
      image: imageURL.value,
      createdBy: user.email,
      updatedAt: new Date()
    };

    publishBtn.innerText = "Saving...";

    if (editingId) {
      await db.collection("news").doc(editingId).update(data);
      alert("✅ Article Updated!");
      editingId = null;
      publishBtn.innerText = "Publish";
    } else {
      await db.collection("news").add({
        ...data,
        date: new Date(),
        views: 0
      });
      alert("✅ News Published!");
    }

    clearForm();
    loadArticles();

  } catch (err) {
    alert("❌ " + err.message);
  }

  publishBtn.innerText = editingId ? "Update" : "Publish";
};

// LOAD ARTICLES
async function loadArticles() {
  const container = document.getElementById("articlesList");
  container.innerHTML = "";

  const snapshot = await db.collection("news").orderBy("date", "desc").get();

  snapshot.forEach(doc => {
    const data = doc.data();

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <strong>${data.title}</strong><br>
      <small>${data.category || ""} • 👁️ ${data.views || 0}</small><br><br>

      <button onclick="editArticle('${doc.id}')">Edit</button>
      <button onclick="deleteArticle('${doc.id}')">Delete</button>
    `;

    container.appendChild(div);
  });
}

// EDIT ARTICLE
window.editArticle = async (id) => {
  const doc = await db.collection("news").doc(id).get();
  const data = doc.data();

  title.value = data.title || "";
  author.value = data.author || "";
  location.value = data.location || "";
  category.value = data.category || "";
  description.value = data.description || "";
  imageURL.value = data.image || "";

  if(data.image){
    imagePreview.src = data.image;
    imagePreview.style.display = "block";
  }

  editingId = id;
  publishBtn.innerText = "Update";
};

// DELETE ARTICLE
window.deleteArticle = async (id) => {
  if (!confirm("Are you sure you want to delete this article?")) return;

  try {
    await db.collection("news").doc(id).delete();
    alert("🗑️ Article deleted");
    loadArticles();
  } catch (err) {
    alert("❌ " + err.message);
  }
};
</script>

</body>
</html>
