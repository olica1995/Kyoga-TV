<!DOCTYPE html>
<html>
<head>
<title>Kyoga TV Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<style>
body { font-family: Arial; max-width:500px; margin:auto; padding:20px; background:#f2f2f2; }
input, textarea, button { width:100%; padding:10px; margin:8px 0; }
button { background:#1d1147; color:#fff; border:none; }
#adminDiv { display:none; }
</style>
</head>

<body>

<h2>Admin Panel</h2>

<div id="loginDiv">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="loginBtn">Login</button>
</div>

<div id="adminDiv">
  <input id="title" placeholder="Title">
  <input id="author" placeholder="Author">
  <input id="location" placeholder="Location">
  <input id="category" placeholder="Category">

  <!-- Image URL instead of file upload -->
  <input id="imageURL" placeholder="Image URL (https://...)">

  <textarea id="description" placeholder="Description"></textarea>

  <button id="publishBtn">Publish</button>
  <button id="logoutBtn">Logout</button>

  <hr>

  <h3>Existing Articles</h3>
  <div id="articlesList"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBGgDRu812I2saYcq3W0LuLyH8WpxDyHv8",
  authDomain: "kyogatvnews.firebaseapp.com",
  projectId: "kyogatvnews"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let editingId = null;

// AUTH STATE
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById("loginDiv").style.display = "none";
    document.getElementById("adminDiv").style.display = "block";
    loadArticles();
  } else {
    document.getElementById("loginDiv").style.display = "block";
    document.getElementById("adminDiv").style.display = "none";
  }
});

// LOGIN
document.getElementById("loginBtn").onclick = async () => {
  try {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    await auth.signInWithEmailAndPassword(email, password);
    alert("✅ Logged in");
  } catch (err) {
    alert(err.message);
  }
};

// LOGOUT
document.getElementById("logoutBtn").onclick = () => {
  auth.signOut();
};

// CLEAR FORM
function clearForm() {
  document.getElementById("title").value = "";
  document.getElementById("author").value = "";
  document.getElementById("location").value = "";
  document.getElementById("category").value = "";
  document.getElementById("description").value = "";
  document.getElementById("imageURL").value = "";
}

// PUBLISH / UPDATE
document.getElementById("publishBtn").onclick = async () => {
  try {
    const user = auth.currentUser;

    if (!user) {
      alert("❌ Not logged in");
      return;
    }

    const title = document.getElementById("title").value;
    const author = document.getElementById("author").value;
    const location = document.getElementById("location").value;
    const category = document.getElementById("category").value;
    const description = document.getElementById("description").value;
    const imageURL = document.getElementById("imageURL").value;

    if (!imageURL) {
      alert("❌ Please provide an image URL");
      return;
    }

    const data = {
      title,
      author,
      location,
      category,
      description,
      image: imageURL,
      createdBy: user.email,
      updatedAt: new Date()
    };

    if (editingId) {
      await db.collection("news").doc(editingId).update(data);
      alert("✅ Article Updated!");
      editingId = null;
      document.getElementById("publishBtn").innerText = "Publish";
    } else {
      await db.collection("news").add({
        ...data,
        date: new Date(),
        views: 0
      });
      alert("✅ News Published!");
    }

    clearForm();
    loadArticles();

  } catch (err) {
    console.error(err);
    alert("❌ " + err.message);
  }
};

// LOAD ARTICLES
async function loadArticles() {
  const container = document.getElementById("articlesList");
  container.innerHTML = "";

  const snapshot = await db.collection("news").orderBy("date", "desc").get();

  snapshot.forEach(doc => {
    const data = doc.data();

    const div = document.createElement("div");
    div.style.border = "1px solid #ccc";
    div.style.padding = "10px";
    div.style.marginBottom = "10px";
    div.style.background = "#fff";

    div.innerHTML = `
      <strong>${data.title}</strong><br>
      <small>${data.category || ""}</small><br><br>

      <button onclick="editArticle('${doc.id}')">Edit</button>
      <button onclick="deleteArticle('${doc.id}')">Delete</button>
    `;

    container.appendChild(div);
  });
}

// EDIT ARTICLE
window.editArticle = async (id) => {
  const doc = await db.collection("news").doc(id).get();
  const data = doc.data();

  document.getElementById("title").value = data.title || "";
  document.getElementById("author").value = data.author || "";
  document.getElementById("location").value = data.location || "";
  document.getElementById("category").value = data.category || "";
  document.getElementById("description").value = data.description || "";
  document.getElementById("imageURL").value = data.image || "";

  editingId = id;
  document.getElementById("publishBtn").innerText = "Update";
};

// DELETE ARTICLE
window.deleteArticle = async (id) => {
  if (!confirm("Are you sure you want to delete this article?")) return;

  try {
    await db.collection("news").doc(id).delete();
    alert("🗑️ Article deleted");
    loadArticles();
  } catch (err) {
    alert("❌ " + err.message);
  }
};
</script>

</body>
</html>
