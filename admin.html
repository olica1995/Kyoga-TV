<!DOCTYPE html>
<html>
<head>
<title>Kyoga TV Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<style>
body { font-family: Arial; max-width:700px; margin:auto; background:#f2f2f2; padding:20px; }
input, textarea, button { width:100%; padding:10px; margin:6px 0; }
button { background:#1d1147; color:#fff; border:none; cursor:pointer; }
.news { background:#fff; padding:10px; margin:10px 0; border-radius:6px; }
img { width:100%; }
#adminDiv { display:none; }
</style>
</head>

<body>

<h2>Kyoga TV Admin</h2>

<div id="loginDiv">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div id="adminDiv">

  <h3>Post / Edit News</h3>

  <input id="title" placeholder="Title">
  <input id="author" placeholder="Author">
  <input id="location" placeholder="Location">
  <input id="category" placeholder="Category">
  <input id="imageUrl" placeholder="Image URL">
  <textarea id="description" placeholder="Description"></textarea>

  <button onclick="publish()" id="publishBtn">Publish</button>
  <button onclick="updateNews()" id="updateBtn" style="display:none;">Update</button>
  <button onclick="logout()">Logout</button>

  <h3>All News</h3>
  <div id="newsList"></div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBGgDRu812I2saYcq3W0LuLyH8WpxDyHv8",
  authDomain: "kyogatvnews.firebaseapp.com",
  projectId: "kyogatvnews"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let editId = null;

/* AUTH */
auth.onAuthStateChanged(user => {
  if (user) {
    loginDiv.style.display = "none";
    adminDiv.style.display = "block";
    loadNews();
  } else {
    loginDiv.style.display = "block";
    adminDiv.style.display = "none";
  }
});

function login() {
  auth.signInWithEmailAndPassword(email.value, password.value)
    .catch(err => alert(err.message));
}

function logout() {
  auth.signOut();
}

/* PUBLISH */
async function publish() {
  if (!title.value || !description.value || !imageUrl.value) {
    return alert("Fill required fields");
  }

  await db.collection("news").add({
    title: title.value,
    author: author.value,
    location: location.value,
    category: category.value,
    description: description.value,
    imageUrl: imageUrl.value,
    date: new Date()
  });

  alert("Published");
  clearForm();
  loadNews();
}

/* LOAD NEWS */
async function loadNews() {
  const snap = await db.collection("news").orderBy("date", "desc").get();
  newsList.innerHTML = "";

  snap.forEach(doc => {
    const n = doc.data();

    newsList.innerHTML += `
      <div class="news">
        <h4>${n.title}</h4>
        <img src="${n.imageUrl}">
        <p>${n.description}</p>

        <button onclick="edit('${doc.id}', \`${n.title}\`, \`${n.description}\`, '${n.imageUrl}', '${n.author}', '${n.location}', '${n.category}')">Edit</button>
        <button onclick="remove('${doc.id}')">Delete</button>
      </div>
    `;
  });
}

/* EDIT */
function edit(id, t, d, img, a, l, c) {
  editId = id;

  title.value = t;
  description.value = d;
  imageUrl.value = img;
  author.value = a;
  location.value = l;
  category.value = c;

  publishBtn.style.display = "none";
  updateBtn.style.display = "block";
}

/* UPDATE */
async function updateNews() {
  await db.collection("news").doc(editId).update({
    title: title.value,
    description: description.value,
    imageUrl: imageUrl.value,
    author: author.value,
    location: location.value,
    category: category.value
  });

  alert("Updated");
  clearForm();
  loadNews();
}

/* DELETE */
async function remove(id) {
  if (!confirm("Delete this news?")) return;

  await db.collection("news").doc(id).delete();
  loadNews();
}

/* CLEAR */
function clearForm() {
  title.value = "";
  description.value = "";
  imageUrl.value = "";
  author.value = "";
  location.value = "";
  category.value = "";

  editId = null;
  publishBtn.style.display = "block";
  updateBtn.style.display = "none";
}
</script>

</body>
</html>
