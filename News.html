<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="Kyoga TV News – Latest news, updates, and stories.">
<title>Kyoga TV News</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto+Slab:wght@400;600&display=swap" rel="stylesheet" />
<style>
:root {
  --primary-color: #1d1147;
  --accent-color: #f0ac45;
  --bg-color: #f2f2f2;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family: 'Poppins', sans-serif; background-color: var(--bg-color); color:#333; line-height:1.6; }

header { position: sticky; top:0; background:#fff; border-bottom:2px solid #ddd; z-index:1000; }
.header-top { text-align:center; padding:8px 15px; }
.logo-title { display:flex; flex-direction:column; align-items:center; gap:6px; }
.logo-title img { height:40px; }
.logo-title h1 { color:var(--primary-color); font-size:20px; margin:0; }
.datetime { font-family:'Roboto Slab', serif; font-size:14px; color:#555; margin-top:3px; }

nav.nav { background-color: var(--primary-color); display:flex; justify-content:center; align-items:center; padding:6px 15px; flex-wrap:wrap; }
.nav-links { list-style:none; display:flex; gap:15px; }
.nav-links li a { color:#fff; font-weight:600; padding:6px 10px; border-radius:5px; text-decoration:none; transition:background 0.3s; }
.nav-links li a:hover { background: var(--accent-color); color: var(--primary-color); }
#menu-toggle { display:none; font-size:28px; color:#fff; background:none; border:none; cursor:pointer; }

.news-container { max-width:1000px; margin:30px auto; padding:0 20px; }
.news-categories { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px; }
.category-btn { padding:6px 12px; border-radius:5px; background-color:var(--accent-color); color:#fff; font-weight:600; cursor:pointer; transition:background 0.3s; }
.category-btn:hover { background-color:var(--primary-color); }
.news-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px; }
.news-card { background:#fff; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); overflow:hidden; transition: transform 0.3s, box-shadow 0.3s, opacity 0.3s; cursor:pointer; opacity:1; }
.news-card.hidden { opacity:0; transform:scale(0.95); pointer-events:none; }
.news-card img { width:100%; height:180px; object-fit:cover; transition: transform 0.3s; }
.news-card:hover { transform:translateY(-5px); box-shadow:0 6px 25px rgba(0,0,0,0.15); }
.news-card:hover img { transform: scale(1.05); }
.news-content { padding:15px; }
.news-content h3 { font-size:18px; color:var(--primary-color); margin-bottom:4px; }
.news-content small { display:block; color:#888; font-size:12px; margin-bottom:6px; }
.news-content p { font-size:14px; color:#555; margin-bottom:10px; }
.read-more { font-weight:600; color:var(--accent-color); text-decoration:none; transition:color 0.3s; }
.read-more:hover { color:var(--primary-color); }

#load-more { display:block; margin:20px auto; padding:10px 20px; background:var(--accent-color); color:#fff; font-weight:600; border:none; border-radius:5px; cursor:pointer; transition: background 0.3s; }
#load-more:hover { background:var(--primary-color); }

.modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index:2000; }
.modal-content { background:#fff; padding:20px; border-radius:12px; max-width:600px; width:90%; max-height:90%; overflow-y:auto; position:relative; animation:fadeIn 0.3s ease; }
.modal-content img { width:100%; border-radius:10px; margin-bottom:15px; }
.modal-content h3 { margin-bottom:10px; color:var(--primary-color); }
.modal-content p { margin-bottom:15px; }
.close-modal { position:absolute; top:10px; right:15px; font-size:22px; font-weight:bold; cursor:pointer; color:#555; }
@keyframes fadeIn { from {opacity:0; transform:scale(0.95);} to {opacity:1; transform:scale(1);} }

footer { background-color: var(--primary-color); color:white; padding:20px; text-align:center; }
.social-links a { color:var(--accent-color); margin:0 10px; text-decoration:none; }
.social-links a:hover { text-decoration: underline; }

@media(max-width:768px){
  #menu-toggle { display:block; }
  ul.nav-links { flex-direction:column; width:100%; display:none; margin-top:10px; }
  ul.nav-links.show { display:flex; }
  ul.nav-links li { margin:10px 0; }
}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo-title">
      <img src="KYOGA TV.jpg" alt="Kyoga TV Logo" />
      <h1>Kyoga TV</h1>
      <div class="datetime" id="datetime">Loading date & time...</div>
    </div>
  </div>
  <nav class="nav">
    <button id="menu-toggle">&#9776;</button>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="news.html">News</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="our team.html">Our Team</a></li>
      <li><a href="our contacts.html">Our Contacts</a></li>
      <li><a href="Program Line Up.html">Program Line Up</a></li>
      <li><a href="live.html">Live</a></li>
    </ul>
  </nav>
</header>

<main class="news-container">
  <div class="news-categories" id="category-buttons"></div>
  <div class="news-grid" id="news-grid"></div>
  <button id="load-more">Load More</button>
</main>

<div class="modal" id="news-modal">
  <div class="modal-content" id="modal-content">
    <span class="close-modal" id="close-modal">&times;</span>
  </div>
</div>

<footer>
  <div class="social-links">
    <a href="https://facebook.com/kyogatv" target="_blank">Facebook</a> |
    <a href="https://x.com/kyogatv" target="_blank">X (Twitter)</a> |
    <a href="https://tiktok.com/@kyogatv" target="_blank">TikTok</a> |
    <a href="https://youtube.com/@kyogatv" target="_blank">YouTube</a>
  </div>
  <p>&copy; 2025 Kyoga TV. All rights reserved.</p>
</footer>

<script>
  // Date & Time in EAT (UTC+3)
  function updateDateTime() {
    const now = new Date();
    const eatTime = new Date(now.getTime() + 3*60*60*1000); // UTC+3
    const options = { 
      weekday:'long', year:'numeric', month:'long', day:'numeric', 
      hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true 
    };
    document.getElementById('datetime').textContent = eatTime.toLocaleString('en-US', options);
  }
  updateDateTime();
  setInterval(updateDateTime, 1000);

  // Mobile menu toggle
  const toggleBtn = document.getElementById('menu-toggle');
  const navLinks = document.getElementById('nav-links');
  toggleBtn.addEventListener('click', () => navLinks.classList.toggle('show'));

  const newsGrid = document.getElementById('news-grid');
  const categoryButtons = document.getElementById('category-buttons');
  const modal = document.getElementById('news-modal');
  const modalContent = document.getElementById('modal-content');
  const loadMoreBtn = document.getElementById('load-more');

  let itemsPerPage = 4;
  let currentPage = 1;
  let currentCategory = 'All';
  let newsData = [];

  // Fetch JSON & sort newest first
  async function fetchNews() {
    try {
      const response = await fetch('news.json');
      if(!response.ok) throw new Error('Network error');
      const data = await response.json();
      newsData = data.sort((a,b)=>new Date(b.date) - new Date(a.date));
      initializeCategories();
      displayNews();
    } catch(err) {
      console.warn('Failed to fetch news.json:', err);
    }
  }

  function initializeCategories() {
    categoryButtons.innerHTML = '';
    const categories = ['All', ...new Set(newsData.map(item => item.category))];
    categories.forEach(cat => {
      const btn = document.createElement('div');
      btn.className = 'category-btn';
      btn.textContent = cat;
      btn.onclick = () => { currentCategory = cat; currentPage=1; displayNews(); }
      categoryButtons.appendChild(btn);
    });
  }

  function getFilteredData() {
    return currentCategory === 'All' ? newsData : newsData.filter(item => item.category === currentCategory);
  }

  function formatEAT(dateStr) {
    const date = new Date(dateStr);
    const eatDate = new Date(date.getTime() + 3*60*60*1000); // UTC+3
    return eatDate.toLocaleString('en-US', {
      year: 'numeric', month: 'long', day: 'numeric',
      hour: '2-digit', minute:'2-digit', hour12:true
    });
  }

  function displayNews() {
    const filtered = getFilteredData();
    const end = itemsPerPage * currentPage;
    newsGrid.innerHTML = '';
    filtered.slice(0,end).forEach(item => {
      const card = document.createElement('div');
      card.className = 'news-card';
      const formattedDate = formatEAT(item.date);
      card.innerHTML = `
        <img src="${item.image}" alt="${item.title}">
        <div class="news-content">
          <h3>${item.title}</h3>
          <small>${formattedDate}</small>
          <p>${item.description.substring(0,80)}...</p>
          <a class="read-more">Read More →</a>
        </div>`;
      newsGrid.appendChild(card);
      card.querySelector('.read-more').addEventListener('click', e => { e.stopPropagation(); openModal(item); });
    });
    loadMoreBtn.style.display = (end >= filtered.length) ? 'none' : 'block';
  }

  loadMoreBtn.addEventListener('click', () => { currentPage++; displayNews(); });

  function openModal(item) {
    const formattedDate = formatEAT(item.date);
    modalContent.innerHTML = `
      <span class="close-modal" id="close-modal">&times;</span>
      <img src="${item.image}" alt="${item.title}">
      <h3>${item.title}</h3>
      <small>${formattedDate}</small>
      <p>${item.description}</p>`;
    modal.style.display = 'flex';
    document.getElementById('close-modal').onclick = ()=> modal.style.display='none';
  }

  window.onclick = e => { if(e.target==modal) modal.style.display='none'; }

  fetchNews();
</script>

</body>
</html>
