<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="Kyoga TV News – Latest news, updates, and stories.">
<title>Kyoga TV News</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet" />
<style>
:root {
  --primary-color: #1d1147;
  --accent-color: #f0ac45;
  --bg-color: #f9f9fb;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { 
  font-family: 'Poppins', sans-serif; 
  background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); 
  color:#333; 
  line-height:1.7; 
}

/* Header */
header { position: sticky; top:0; background:#fff; border-bottom:2px solid #ddd; z-index:1000; }
.header-top { text-align:center; padding:8px 15px; }
.logo-title { display:flex; flex-direction:column; align-items:center; gap:6px; }
.logo-title img { height:45px; }
.logo-title h1 { color:var(--primary-color); font-size:22px; margin:0; font-family:'Roboto Slab', serif; }
.datetime { font-family:'Roboto Slab', serif; font-size:14px; color:#555; margin-top:3px; }

nav.nav { background-color: var(--primary-color); display:flex; justify-content:center; align-items:center; padding:6px 15px; flex-wrap:wrap; }
.nav-links { list-style:none; display:flex; gap:15px; }
.nav-links li a { color:#fff; font-weight:600; padding:6px 10px; border-radius:5px; text-decoration:none; transition:background 0.3s; }
.nav-links li a:hover { background: var(--accent-color); color: var(--primary-color); }
#menu-toggle { display:none; font-size:28px; color:#fff; background:none; border:none; cursor:pointer; }

/* News Page */
.news-container { max-width:1100px; margin:40px auto; padding:0 20px; }
.news-categories { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:25px; justify-content:center; }
.category-btn { padding:8px 16px; border-radius:25px; background-color:var(--primary-color); color:#fff; font-weight:600; cursor:pointer; transition:all 0.3s; font-size:14px; }
.category-btn:hover { background-color:var(--accent-color); color:#000; }
.news-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:25px; }
.news-card { background:#fff; border-radius:15px; box-shadow:0 6px 20px rgba(0,0,0,0.08); overflow:hidden; transition: transform 0.3s, box-shadow 0.3s; }
.news-card:hover { transform:translateY(-7px); box-shadow:0 10px 28px rgba(0,0,0,0.12); }
.news-card img { width:100%; height:200px; object-fit:cover; }
.news-content { padding:18px; }
.news-content h3 { font-size:20px; color:var(--primary-color); margin-bottom:10px; font-family:'Roboto Slab', serif; }
.news-content p { font-size:15px; color:#555; margin-bottom:12px; }
.read-more { display:inline-block; padding:8px 14px; background:var(--accent-color); color:#fff; font-weight:600; border-radius:6px; text-decoration:none; transition:background 0.3s; }
.read-more:hover { background:var(--primary-color); color:#fff; }

/* Load More Button */
#load-more { display:block; margin:30px auto; padding:12px 22px; background:var(--primary-color); color:#fff; font-weight:600; border:none; border-radius:8px; cursor:pointer; font-size:15px; transition: background 0.3s; }
#load-more:hover { background:var(--accent-color); color:#000; }

/* Single Article View */
.single-article { max-width:850px; margin:40px auto; padding:25px; background:#fff; border-radius:15px; box-shadow:0 6px 20px rgba(0,0,0,0.1); }
.single-article img { width:100%; border-radius:12px; margin-bottom:20px; }
.single-article h2 { margin-bottom:18px; color:var(--primary-color); font-family:'Roboto Slab', serif; }
.single-article p { margin-bottom:15px; font-size:16px; color:#444; }

/* Footer */
footer { background-color: var(--primary-color); color:white; padding:25px; text-align:center; margin-top:40px; }
.social-links a { color:var(--accent-color); margin:0 10px; text-decoration:none; font-weight:600; }
.social-links a:hover { text-decoration: underline; }

/* Responsive */
@media(max-width:768px){
  #menu-toggle { display:block; }
  ul.nav-links { flex-direction:column; width:100%; display:none; margin-top:10px; }
  ul.nav-links.show { display:flex; }
  ul.nav-links li { margin:10px 0; }
}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo-title">
      <img src="KYOGA TV.jpg" alt="Kyoga TV Logo" />
      <h1>Kyoga TV</h1>
      <div class="datetime" id="datetime">Loading date & time...</div>
    </div>
  </div>
  <nav class="nav" role="navigation">
    <button id="menu-toggle" aria-label="Toggle Menu">&#9776;</button>
    <ul class="nav-links" id="nav-links">
      <li><a href="home.html">Home</a></li>
      <li><a href="news.html">News</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="our team.html">Our Team</a></li>
      <li><a href="our contacts.html">Our Contacts</a></li>
      <li><a href="Program Line Up.html">Program Line Up</a></li>
      <li><a href="live.html">Live</a></li>
    </ul>
  </nav>
</header>

<main class="news-container" id="news-container">
  <div class="news-categories" id="category-buttons"></div>
  <div class="news-grid" id="news-grid"></div>
  <button id="load-more">Load More</button>
</main>

<footer>
  <div class="social-links">
    <a href="https://facebook.com/kyogatv" target="_blank">Facebook</a> |
    <a href="https://x.com/kyogatv" target="_blank">X (Twitter)</a> |
    <a href="https://tiktok.com/@kyogatv" target="_blank">TikTok</a> |
    <a href="https://youtube.com/@kyogatv" target="_blank">YouTube</a>
  </div>
  <p><a href="mailto:olicafelix95@gmail.com" style="color:white;">Send Email</a> | <a href="https://wa.me/256789223294" style="color:white;" target="_blank">WhatsApp: +256789223294</a></p>
  <p>&copy; 2025 Kyoga TV. All rights reserved.</p>
</footer>

<script>
// Date & Time (East Africa Time)
function updateDateTime() {
  const now = new Date();
  const options = {
    weekday:'long', year:'numeric', month:'long', day:'numeric',
    hour:'2-digit', minute:'2-digit', second:'2-digit',
    hour12:true, timeZone:'Africa/Nairobi'
  };
  document.getElementById('datetime').textContent = now.toLocaleString('en-US', options);
}
updateDateTime(); setInterval(updateDateTime,1000);

// Mobile menu toggle
const toggleBtn=document.getElementById('menu-toggle');
const navLinks=document.getElementById('nav-links');
toggleBtn.addEventListener('click',()=>{ 
  navLinks.classList.toggle('show'); 
  toggleBtn.setAttribute('aria-expanded', navLinks.classList.contains('show')); 
});

// Fetch News Data
let newsData = [];
async function loadNews(){
  try{
    const res = await fetch('news.json');
    newsData = await res.json();
    // Sort newest first
    newsData.sort((a,b)=> new Date(b.date) - new Date(a.date));
    checkSingleArticle();
  }catch(err){ console.error("Error loading news.json",err); }
}

// Categories + Display
const categoryButtons=document.getElementById('category-buttons');
const newsGrid=document.getElementById('news-grid');
const loadMoreBtn=document.getElementById('load-more');
const itemsPerPage=4;
let currentPage=1, currentCategory='all';

function setupCategories(){
  const categories=["all", ...new Set(newsData.map(item=>item.category))];
  categoryButtons.innerHTML='';
  categories.forEach(cat=>{
    const btn=document.createElement('div');
    btn.className='category-btn';
    btn.textContent=cat.charAt(0).toUpperCase()+cat.slice(1);
    btn.onclick=()=>{ currentCategory=cat; currentPage=1; displayNews(); };
    categoryButtons.appendChild(btn);
  });
}

function getFilteredData(){
  return currentCategory==='all'? newsData : newsData.filter(item=>item.category===currentCategory);
}

function displayNews(){
  setupCategories();
  const filtered=getFilteredData();
  const end=itemsPerPage*currentPage;
  newsGrid.innerHTML='';
  filtered.slice(0,end).forEach(item=>{
    // show only first paragraph
    const firstParagraph=item.description.split('\\n\\n')[0];
    const card=document.createElement('div');
    card.className='news-card';
    card.innerHTML=`
      <img loading="lazy" src="${item.image}" alt="${item.title}">
      <div class="news-content">
        <h3>${item.title}</h3>
        <p>${firstParagraph}</p>
        <a class="read-more" href="news.html?title=${encodeURIComponent(item.title)}">Read More →</a>
      </div>`;
    newsGrid.appendChild(card);
  });
  loadMoreBtn.style.display=(end>=filtered.length)?'none':'block';
}
loadMoreBtn.addEventListener('click',()=>{ currentPage++; displayNews(); });

// Single article page
function checkSingleArticle(){
  const params=new URLSearchParams(window.location.search);
  const title=params.get('title');
  if(title){
    const article=newsData.find(n=>n.title===decodeURIComponent(title));
    if(article){
      document.getElementById('news-container').innerHTML=renderSingleArticle(article);
    }
  }else{
    displayNews();
  }
}
function renderSingleArticle(item){
  const paragraphs=item.description.split('\\n\\n').map(p=>`<p>${p}</p>`).join('');
  return `
    <div class="single-article">
      <img src="${item.image}" alt="${item.title}">
      <h2>${item.title}</h2>
      ${paragraphs}
    </div>`;
}

loadNews();
</script>
</body>
</html>
