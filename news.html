<!DOCTYPE html>
<html>
<head>
<title>Kyoga TV News</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body {
  font-family: 'Inter', sans-serif;
  background: #f2f2f2;
  margin: 0;
  padding: 0;
  color: #222;
}

/* Admin Button */
.admin-btn {
  position: fixed;
  top: 15px;
  right: 15px;
  background: #1d1147;
  color: #fff;
  padding: 8px 14px;
  border-radius: 6px;
  text-decoration: none;
  font-size: 14px;
  z-index: 1000;
}

.admin-btn:hover {
  background: #f0ac45;
  color: #000;
}

/* Heading */
h1 {
  text-align: center;
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  padding: 15px;
  font-size: 28px;
  letter-spacing: 1px;
  color: #1d1147;
}

/* Search */
#search {
  display: block;
  width: 90%;
  max-width: 500px;
  margin: 10px auto;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
}

/* Grid */
.news-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
  padding: 16px;
}

/* Card */
.news-card {
  background: #ffffff;
  padding: 12px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  transition: transform 0.2s ease;
}

.news-card:hover {
  transform: translateY(-3px);
}

/* Image */
.news-card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 8px;
}

/* Title */
.news-card h3 {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  margin: 10px 0 5px;
  line-height: 1.3;
}

/* Meta */
.news-card p {
  font-size: 14px;
  color: #555;
}

/* Button */
button {
  margin-top: 8px;
  padding: 8px 12px;
  border: none;
  background: #1d1147;
  color: white;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
}

button:hover {
  background: #f0ac45;
  color: black;
}

/* Mobile */
@media (max-width: 600px) {
  h1 {
    font-size: 22px;
  }

  .news-card img {
    height: 150px;
  }
}
</style>
</head>

<body>

<!-- Admin Button -->
<a href="admin.html" class="admin-btn">Admin</a>

<h1>Kyoga TV News</h1>

<input type="text" id="search" placeholder="Search...">

<div id="news-grid" class="news-grid"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBGgDRu812I2saYcq3W0LuLyH8WpxDyHv8",
  authDomain: "kyogatvnews.firebaseapp.com",
  projectId: "kyogatvnews",
  storageBucket: "kyogatvnews.firebasestorage.app",
  messagingSenderId: "721054655198",
  appId: "1:721054655198:web:abf9aebc667366aefe184f"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let newsData = [];
let searchQuery = "";

// REAL-TIME DATA
db.collection("news").orderBy("date","desc")
.onSnapshot(snapshot=>{
  newsData = snapshot.docs.map(doc=>({
    id: doc.id,
    ...doc.data()
  }));
  displayNews();
});

// SEARCH
document.getElementById("search").oninput = (e)=>{
  searchQuery = e.target.value.toLowerCase();
  displayNews();
};

// VIEW COUNT
async function increaseViews(id){
  await db.collection("news").doc(id).update({
    views: firebase.firestore.FieldValue.increment(1)
  });
}

// DISPLAY
function displayNews(){
  const grid = document.getElementById("news-grid");
  grid.innerHTML = "";

  newsData
  .filter(n=> n.title.toLowerCase().includes(searchQuery))
  .forEach(item=>{

    const card = document.createElement("div");
    card.className = "news-card";

    const img = document.createElement("img");
    img.src = item.image;

    const title = document.createElement("h3");
    title.textContent = item.title;

    const meta = document.createElement("p");
    meta.innerHTML = `<em>${item.author} - ${item.location}</em>`;

    const views = document.createElement("p");
    views.textContent = "👁️ " + (item.views || 0);

    const btn = document.createElement("button");
    btn.textContent = "Read More";

    const full = document.createElement("p");
    full.textContent = item.description;
    full.style.display = "none";

    btn.onclick = async ()=>{
      if(full.style.display==="none"){
        full.style.display="block";
        btn.textContent="Show Less";
        await increaseViews(item.id);
      } else {
        full.style.display="none";
        btn.textContent="Read More";
      }
    };

    card.append(img, title, meta, views, btn, full);
    grid.appendChild(card);
  });
}
</script>

</body>
</html>
