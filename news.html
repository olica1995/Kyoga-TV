<!DOCTYPE html>
<html>
<head>
<title>Kyoga TV News</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body { font-family: Inter; margin:0; background:#f4f6f8; }

header {
  background:#1d1147;
  color:#fff;
  padding:15px;
  display:flex;
  justify-content:space-between;
}

.nav-buttons a {
  text-decoration:none;
  background:white;
  color:#1d1147;
  padding:6px 12px;
  margin-left:8px;
  border-radius:5px;
}

#breaking {
  background:red;
  color:white;
  padding:10px;
  display:none;
  cursor:pointer;
}

#filters { text-align:center; padding:10px; }

#filters button {
  margin:5px;
  padding:8px;
  border:none;
  background:#1d1147;
  color:white;
}

.news-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
  padding:20px;
}

.news-card {
  background:#fff;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
}

.news-card img {
  width:100%;
  max-height:200px;
  object-fit:contain;
}

#article-view {
  display:none;
  max-width:900px;
  margin:auto;
  background:#fff;
}

.article-content { padding:20px; }
</style>
</head>

<body>

<header>
  <div>Kyoga TV News</div>
  <div class="nav-buttons">
    <a href="home.html">Home</a>
    <a href="admin.html">Admin</a>
  </div>
</header>

<div id="breaking"></div>
<div id="filters"></div>
<div id="news-grid" class="news-grid"></div>

<div id="article-view">
  <button onclick="goBack()">← Back</button>

  <img id="article-image" style="width:100%;max-height:400px;object-fit:contain">

  <div class="article-content">
    <h1 id="article-title"></h1>
    <div id="article-meta"></div>
    <div id="article-body"></div>

    <a id="full-link" target="_blank">Read Full Story</a>

    <div>
      <button onclick="shareWhatsApp()">WhatsApp</button>
      <button onclick="copyLink()">Copy Link</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "kyogatvnews.firebaseapp.com",
  projectId: "kyogatvnews"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ✅ DEFINE ELEMENTS PROPERLY */
const breaking = document.getElementById("breaking");
const filters = document.getElementById("filters");
const newsGrid = document.getElementById("news-grid");
const articleView = document.getElementById("article-view");
const articleImage = document.getElementById("article-image");
const articleTitle = document.getElementById("article-title");
const articleMeta = document.getElementById("article-meta");
const articleBody = document.getElementById("article-body");
const fullLink = document.getElementById("full-link");

let newsData = [];
let currentArticle = null;

/* SLUG */
function slugify(title){
  return title.toLowerCase()
    .replace(/[^a-z0-9 ]/g,"")
    .replace(/\s+/g,"-");
}

/* LOAD NEWS */
db.collection("news").orderBy("date","desc")
.onSnapshot(snapshot=>{
  newsData = snapshot.docs.map(doc=>({
    id:doc.id,
    ...doc.data()
  }));

  showBreaking();
  showFilters();
  displayNews(newsData);

  setTimeout(loadFromURL, 300);
});

/* BREAKING */
function showBreaking(){
  const item = newsData.find(n=>n.breaking);

  if(item){
    breaking.style.display="block";
    breaking.innerText="🚨 "+item.title;
    breaking.onclick=()=>openArticle(item);
  }
}

/* FILTERS */
function showFilters(){
  const cats=[...new Set(newsData.map(n=>n.category).filter(Boolean))];

  filters.innerHTML=`<button onclick="displayNews(newsData)">All</button>`;

  cats.forEach(c=>{
    const b=document.createElement("button");
    b.innerText=c;
    b.onclick=()=>displayNews(newsData.filter(n=>n.category===c));
    filters.appendChild(b);
  });
}

/* DISPLAY */
function displayNews(list){
  newsGrid.innerHTML="";

  list.forEach(item=>{
    const div=document.createElement("div");
    div.className="news-card";

    div.innerHTML=`
      <img src="${item.image}" onerror="this.src='https://via.placeholder.com/400x200'">
      <h3 style="padding:10px">${item.title}</h3>
    `;

    div.onclick=()=>openArticle(item);

    newsGrid.appendChild(div);
  });
}

/* OPEN ARTICLE */
async function openArticle(item){
  currentArticle=item;

  newsGrid.style.display="none";
  articleView.style.display="block";

  articleImage.src=item.image;
  articleTitle.innerText=item.title;
  articleMeta.innerText=`${item.author||""} • ${item.location||""} • 👁️ ${item.views||0}`;
  articleBody.innerHTML=item.description;

  if(item.link){
    fullLink.href=item.link;
    fullLink.style.display="block";
  } else {
    fullLink.style.display="none";
  }

  const slug = slugify(item.title);
  const url = `/news.html/${slug}-${item.id}`;
  history.pushState({}, "", url);

  const key="view_"+item.id;
  if(!localStorage.getItem(key)){
    await db.collection("news").doc(item.id).update({
      views: firebase.firestore.FieldValue.increment(1)
    });
    localStorage.setItem(key,true);
  }
}

/* LOAD FROM URL */
function loadFromURL(){
  const path = window.location.pathname.split("/").pop();

  if(!path || !path.includes("-")) return;

  const id = path.split("-").pop();

  const article = newsData.find(n=>n.id===id);

  if(article){
    openArticle(article);
  }
}

/* BACK */
function goBack(){
  articleView.style.display="none";
  newsGrid.style.display="grid";
  history.pushState({}, "", "/news.html");
}

/* SHARE */
function shareWhatsApp(){
  window.open(`https://wa.me/?text=${currentArticle.title} ${location.href}`);
}

function copyLink(){
  navigator.clipboard.writeText(location.href);
  alert("Copied!");
}
</script>

</body>
</html>
