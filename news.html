<!DOCTYPE html>
<html>
<head>
<title>Kyoga TV News</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- SEO -->
<meta name="description" content="Latest news from Kyoga TV">
<meta name="keywords" content="Kyoga TV, Uganda news, breaking news">
<meta name="author" content="Kyoga TV">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body { font-family: Inter; margin:0; background:#f4f6f8; }

/* HEADER */
header {
  background: linear-gradient(90deg,#1d1147,#3a2c85);
  color:#fff;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.nav-buttons a {
  text-decoration:none;
  background:white;
  color:#1d1147;
  padding:6px 12px;
  margin-left:8px;
  border-radius:5px;
  font-size:0.8rem;
  font-weight:600;
}

/* BREAKING */
#breaking {
  background:red;
  color:white;
  padding:10px;
  font-weight:bold;
  display:none;
  cursor:pointer;
}

/* FILTER */
#filters {
  padding:10px;
  text-align:center;
}
#filters button {
  margin:5px;
  padding:8px 12px;
  border:none;
  background:#1d1147;
  color:white;
  cursor:pointer;
}

/* GRID */
.news-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
  padding:20px;
}

.news-card {
  background:#fff;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
}

.news-card img {
  width:100%;
  max-height:200px;
  object-fit:contain;
}

/* ARTICLE */
#article-view { display:none; max-width:900px; margin:auto; background:#fff; }
.article-content { padding:20px; }

</style>
</head>

<body>

<header>
  <div>Kyoga TV News</div>

  <!-- ✅ RESTORED BUTTONS -->
  <div class="nav-buttons">
    <a href="home.html">Home</a>
    <a href="admin.html">Admin</a>
  </div>
</header>

<div id="breaking"></div>

<div id="filters"></div>

<div id="news-grid" class="news-grid"></div>

<div id="article-view">
  <button onclick="goBack()">← Back</button>

  <img id="article-image" style="width:100%;max-height:400px;object-fit:contain">

  <div class="article-content">
    <h1 id="article-title"></h1>
    <div id="article-meta"></div>
    <div id="article-body"></div>

    <a id="full-link" target="_blank">Read Full Story</a>

    <div>
      <button onclick="shareWhatsApp()">WhatsApp</button>
      <button onclick="shareFacebook()">Facebook</button>
      <button onclick="copyLink()">Copy Link</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "kyogatvnews.firebaseapp.com",
  projectId: "kyogatvnews"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let newsData = [];
let currentArticle = null;

/* SLUG */
function slugify(title){
  return title.toLowerCase()
    .replace(/[^a-z0-9 ]/g,"")
    .replace(/\s+/g,"-");
}

/* LOAD NEWS */
db.collection("news").orderBy("date","desc")
.onSnapshot(snapshot=>{
  newsData = snapshot.docs.map(doc=>({
    id:doc.id,
    ...doc.data()
  }));

  showBreaking();
  showFilters();
  displayNews(newsData);
  loadFromURL();
});

/* BREAKING */
function showBreaking(){
  const breakingItem = newsData.find(n => n.breaking === true);

  if(breakingItem){
    const el = document.getElementById("breaking");
    el.style.display = "block";
    el.innerText = "🚨 BREAKING: " + breakingItem.title;
    el.onclick = ()=> openArticle(breakingItem);
  }
}

/* FILTERS */
function showFilters(){
  const container = document.getElementById("filters");

  const categories = [...new Set(newsData.map(n=>n.category).filter(Boolean))];

  container.innerHTML = `<button onclick="displayNews(newsData)">All</button>`;

  categories.forEach(cat=>{
    const btn = document.createElement("button");
    btn.innerText = cat;
    btn.onclick = ()=>{
      displayNews(newsData.filter(n=>n.category===cat));
    };
    container.appendChild(btn);
  });
}

/* GRID */
function displayNews(list){
  const grid = document.getElementById("news-grid");
  grid.innerHTML = "";

  list.forEach(item=>{
    const div = document.createElement("div");
    div.className="news-card";

    div.innerHTML=`
      <img src="${item.image}" onerror="this.src='https://via.placeholder.com/400x200'">
      <h3 style="padding:10px">${item.title}</h3>
    `;

    div.onclick=()=>openArticle(item);

    grid.appendChild(div);
  });
}

/* OPEN */
async function openArticle(item){
  currentArticle=item;

  newsGrid.style.display="none";
  articleView.style.display="block";

  articleImage.src=item.image;
  articleTitle.innerText=item.title;
  articleMeta.innerText=`${item.author} • ${item.location} • 👁️ ${item.views||0}`;
  articleBody.innerHTML=item.description;

  if(item.link){
    fullLink.href=item.link;
    fullLink.style.display="block";
  }

  const slug = slugify(item.title);
  const url = `/news.html/${slug}`;
  window.history.pushState({}, "", url);

  /* VIEW TRACK */
  const key="view_"+item.id;
  if(!localStorage.getItem(key)){
    await db.collection("news").doc(item.id).update({
      views: firebase.firestore.FieldValue.increment(1)
    });
    localStorage.setItem(key,true);
  }

  addStructuredData(item);
}

/* BACK */
function goBack(){
  articleView.style.display="none";
  newsGrid.style.display="grid";
  window.history.pushState({}, "", "/news.html");
}

/* LOAD FROM URL */
function loadFromURL(){
  const path = window.location.pathname.split("/").pop();
  const article = newsData.find(n=>slugify(n.title)===path);

  if(article) openArticle(article);
}

/* SHARE */
function shareWhatsApp(){
  window.open(`https://wa.me/?text=${currentArticle.title} ${location.href}`);
}

function shareFacebook(){
  window.open(`https://www.facebook.com/sharer/sharer.php?u=${location.href}`);
}

function copyLink(){
  navigator.clipboard.writeText(location.href);
  alert("Copied!");
}

/* SEO STRUCTURED DATA */
function addStructuredData(article){
  const script = document.createElement("script");
  script.type="application/ld+json";

  script.innerHTML = JSON.stringify({
    "@context":"https://schema.org",
    "@type":"NewsArticle",
    "headline":article.title,
    "image":[article.image],
    "datePublished":article.date,
    "author":{"@type":"Person","name":article.author}
  });

  document.head.appendChild(script);
}
</script>

</body>
</html>
