<!DOCTYPE html>
<html>
<head>
<title>Kyoga TV News</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body { font-family:Poppins; background:#f2f2f2; }

/* Animated Heading */
h1 {
  text-align:center;
  animation: slide 3s infinite alternate;
}

@keyframes slide {
  from { letter-spacing:2px; color:#1d1147; }
  to { letter-spacing:6px; color:#f0ac45; }
}

.news-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
  padding:20px;
}

.news-card {
  background:white;
  padding:10px;
  border-radius:10px;
}

img {
  width:100%;
  height:160px;
  object-fit:cover;
}
</style>
</head>

<body>

<h1>Kyoga TV News</h1>

<input type="text" id="search" placeholder="Search..." style="width:90%;margin:10px;">

<div id="news-grid" class="news-grid"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBGgDRu812I2saYcq3W0LuLyH8WpxDyHv8",
  authDomain: "kyogatvnews.firebaseapp.com",
  projectId: "kyogatvnews",
  storageBucket: "kyogatvnews.firebasestorage.app",
  messagingSenderId: "721054655198",
  appId: "1:721054655198:web:abf9aebc667366aefe184f"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let newsData = [];
let searchQuery = "";

// 🔄 REAL-TIME
db.collection("news").orderBy("date","desc")
.onSnapshot(snapshot=>{
  newsData = snapshot.docs.map(doc=>({
    id: doc.id,
    ...doc.data()
  }));
  displayNews();
});

// 🔍 SEARCH
search.oninput = ()=>{
  searchQuery = search.value.toLowerCase();
  displayNews();
};

// 👁️ VIEW COUNT
async function increaseViews(id){
  await db.collection("news").doc(id).update({
    views: firebase.firestore.FieldValue.increment(1)
  });
}

// 📰 DISPLAY
function displayNews(){
  const grid = document.getElementById("news-grid");
  grid.innerHTML = "";

  newsData
  .filter(n=> n.title.toLowerCase().includes(searchQuery))
  .forEach(item=>{

    const card = document.createElement("div");
    card.className = "news-card";

    const img = document.createElement("img");
    img.src = item.image;

    const title = document.createElement("h3");
    title.textContent = item.title;

    const meta = document.createElement("p");
    meta.innerHTML = `<em>${item.author} - ${item.location}</em>`;

    const views = document.createElement("p");
    views.textContent = "👁️ " + (item.views || 0);

    const btn = document.createElement("button");
    btn.textContent = "Read More";

    const full = document.createElement("p");
    full.textContent = item.description;
    full.style.display = "none";

    btn.onclick = async ()=>{
      if(full.style.display==="none"){
        full.style.display="block";
        btn.textContent="Show Less";
        await increaseViews(item.id);
      } else {
        full.style.display="none";
        btn.textContent="Read More";
      }
    };

    card.append(img,title,meta,views,btn,full);
    grid.appendChild(card);
  });
}
</script>

</body>
</html>
